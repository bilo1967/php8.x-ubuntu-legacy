name: Prepare PHP core release files

on:
  workflow_dispatch:
    inputs:
      php_run_id:
        description: 'Successful core build run ID; PHP and PECL are not rebuilt'
        required: true
        type: string
      release_tag:
        description: 'New core release tag (v8.x.xx-focal.y)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-php-core-focal
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify packages and prepare release files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.php_run_id }}
          TAG: ${{ inputs.release_tag }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/prepare-core-release.sh stage
      - name: Preserve staged release files
        uses: actions/upload-artifact@v4
        with:
          name: core-release-${{ inputs.release_tag }}
          path: release-assets/
          retention-days: 30
